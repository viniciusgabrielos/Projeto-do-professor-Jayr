[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-financas"
version = "0.1.0"
description = "Sistema de controle financeiro pessoal"
requires-python = ">=3.10"

[project.scripts]
financas = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["src", "src.domain", "src.repositories"]